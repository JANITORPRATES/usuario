name: Java 25 CI with Gradle

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin' # Opções: temurin, oracle, corretto, zulu

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper # Utiliza a versão definida no gradle-wrapper.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and Test with Gradle
        run: ./gradlew build --warning-mode all
